<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Remover - Shortcuti</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#071226;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:92%;
    max-width:1100px;
    margin:30px auto;
    text-align:center;
}

h1{
    color:#38bdf8;
    margin-bottom:10px;
}

.subtitle{
    color:#cbd5e1;
    margin-bottom:25px;
}

.upload-box{
    border:2px dashed #38bdf8;
    border-radius:18px;
    padding:28px;
    background:rgba(255,255,255,.04);
    margin-bottom:24px;
    transition:0.3s;
}

.upload-box:hover{
    background:rgba(255,255,255,.07);
}

input[type=file]{
    display:none;
}

.upload-label{
    display:inline-block;
    padding:14px 28px;
    background:#38bdf8;
    color:#001018;
    font-weight:700;
    border-radius:12px;
    cursor:pointer;
}

.actions{
    margin:18px 0 28px;
}

button{
    padding:12px 24px;
    margin:8px;
    border:none;
    border-radius:12px;
    background:#38bdf8;
    color:#001018;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0ea5e9;
}

.remove-btn{
    background:#22c55e;
    color:#fff;
    font-size:18px;
    padding:14px 34px;
    border-radius:14px;
    box-shadow:0 8px 20px rgba(34,197,94,.35);
}

.remove-btn:hover{
    background:#16a34a;
}

button.secondary{
    background:#1e293b;
    color:#fff;
}

.preview-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
}

.panel{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:18px;
}

.panel h3{
    color:#38bdf8;
    margin-bottom:12px;
}

.image-wrap{
    min-height:340px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    overflow:hidden;

    background-color:#ffffff;
    background-image:
      linear-gradient(45deg,#e5e7eb 25%, transparent 25%),
      linear-gradient(-45deg,#e5e7eb 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
      linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
    background-size:20px 20px;
    background-position:0 0,0 10px,10px -10px,-10px 0;
}

.image-wrap img{
    max-width:100%;
    max-height:420px;
}

#loading{
    display:none;
    color:#38bdf8;
    font-weight:700;
    margin:12px 0 18px;
}

.downloads{
    display:none;
    margin-top:20px;
}

.downloads a,
.downloads button{
    display:inline-block;
}

.footer{
    margin-top:28px;
}

@media (max-width:768px){
    .preview-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Background Remover</h1>
    <p class="subtitle">Upload an image and get a transparent PNG instantly</p>

    <div class="upload-box" id="dropZone">

        <label class="upload-label" for="imageInput">Choose Image</label>

        <input type="file" id="imageInput" accept="image/*" onchange="previewImage()">

        <p style="margin-top:12px;color:#94a3b8">or drag & drop an image here</p>

    </div>

    <div class="actions">

        <button class="remove-btn" onclick="removeBackground()">Remove Background</button>

    </div>

    <div id="loading">Processing image, please wait...</div>

    <div class="preview-grid">

        <div class="panel">

            <h3>Original</h3>

            <div class="image-wrap">

                <img id="originalPreview">

            </div>

        </div>

        <div class="panel">

            <h3>Background Removed</h3>

            <div class="image-wrap">

                <img id="resultPreview">

            </div>

        </div>

    </div>

    <div class="downloads" id="downloads">

        <a id="downloadPNG" download="background-removed.png"><button>Download PNG</button></a>

        <button onclick="downloadJPG()">Image Download (JPG)</button>

        <button onclick="downloadOriginal()">Original Image Download</button>

    </div>

    <div class="footer">

        <a href="index.html"><button class="secondary">Back Home</button></a>

    </div>

</div>

<script>
let pngBlob = null;
let originalFile = null;

const input = document.getElementById('imageInput');
const dropZone = document.getElementById('dropZone');

dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.style.background = 'rgba(56,189,248,.12)';
});

dropZone.addEventListener('dragleave', () => {
    dropZone.style.background = 'rgba(255,255,255,.04)';
});

dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.style.background = 'rgba(255,255,255,.04)';
    input.files = e.dataTransfer.files;
    previewImage();
});

function previewImage(){

    if(input.files.length === 0) return;

    originalFile = input.files[0];

    const url = URL.createObjectURL(originalFile);

    document.getElementById('originalPreview').src = url;

}

async function removeBackground(){

    if(input.files.length === 0){
        alert('Please select an image first.');
        return;
    }

    document.getElementById('loading').style.display = 'block';

    const formData = new FormData();

    formData.append('image', input.files[0]);

    try{

        const response = await fetch('https://shortcuti-bg-remove.sonalidigitalprint.workers.dev/remove', {
            method:'POST',
            body:formData
        });

        if(!response.ok){
            const err = await response.text();
            throw new Error(err || 'Background removal failed');
        }

        pngBlob = await response.blob();

        const imageURL = URL.createObjectURL(pngBlob);

        document.getElementById('resultPreview').src = imageURL;

        const png = document.getElementById('downloadPNG');

        png.href = imageURL;

        document.getElementById('downloads').style.display = 'block';

    }catch(err){

        alert(err.message);

    }finally{

        document.getElementById('loading').style.display = 'none';

    }

}

function downloadJPG(){

    if(!pngBlob) return;

    const img = new Image();

    img.onload = function(){

        const canvas = document.createElement('canvas');

        canvas.width = img.width;
        canvas.height = img.height;

        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.drawImage(img,0,0);

        canvas.toBlob(function(blob){

            const link = document.createElement('a');

            link.href = URL.createObjectURL(blob);

            link.download = 'background-removed.jpg';

            link.click();

        }, 'image/jpeg', 0.95);

    };

    img.src = URL.createObjectURL(pngBlob);

}

function downloadOriginal(){

    if(!originalFile) return;

    const link = document.createElement('a');

    link.href = URL.createObjectURL(originalFile);

    link.download = originalFile.name;

    link.click();

}
</script>

</body>
</html>
