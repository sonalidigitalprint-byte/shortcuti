<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Remover - Shortcuti</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

.container{
    width:90%;
    max-width:700px;
    margin:60px auto;
}

h1{
    color:#38bdf8;
}

.upload{
    border:2px dashed #38bdf8;
    padding:50px;
    border-radius:15px;
    margin:30px 0;
}

button{
    background:#38bdf8;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0ea5e9;
}
</style>

</head>
<body>

<div class="container">

<h1>🖼 Background Remover</h1>

<p>Upload your image and remove background instantly.</p>

<div class="upload">
<input type="file">
</div>

<button>Remove Background</button>

</div>

</body>
</html>
